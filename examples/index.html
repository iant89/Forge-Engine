<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge — spinning cubes</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #05070a; color: #cbd5e1; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #wrap { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 10px; top: 10px; padding: 8px 10px; background: rgb(5 7 10 / 0.66); border: 1px solid rgb(148 163 184 / 0.25); border-radius: 6px; white-space: pre; pointer-events: none; }
      #error { position: fixed; inset: auto 10px 10px 10px; color: #fca5a5; white-space: pre-wrap; display: none; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="view"></canvas></div>
    <div id="hud">starting…</div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
